spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/companion_db
    username: companion_db_user
    password: companion_db_password
    driver-class-name: org.postgresql.Driver
    hikari: # Опционально: настройки пула соединений
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update # или validate, create, create-drop - стоит обдумать
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

jwt:
  secret: ${JWT_SECRET:JwtSecretKey12345678901234567890123456} # лучше потом сгенерировать новый и постоянно их обновлять
  expiration: ${JWT_EXPIRATION:86400000} # 24 часа

# Логирование (для отладки)
logging:
  level:
    root: INFO
    com.companion: DEBUG
    org.springframework.web: INFO
    org.jooq: DEBUG
    org.jooq.tools.LoggerListener: DEBUG
    # SQL запросы с параметрами
    org.jooq.impl.DefaultDSLContext: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{36}) - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  file:
    name: logs/companion.log
    max-size: 10MB
    max-history: 30